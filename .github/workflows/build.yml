name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # A tag like v1.2.3 gives version 1.2.3, everything else a CI version.
      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}'.TrimStart('v') }
          else { $v = '0.0.0-ci.${{ github.run_number }}' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Version: $v"

      - name: Build
        run: dotnet build DiskTree.csproj -c Release -p:Version=${{ steps.ver.outputs.version }}

      # One self-contained exe: runs on any Windows x64 machine, nothing to install.
      - name: Publish single exe (self-contained)
        run: dotnet publish DiskTree.csproj -c Release -p:SelfContained=true -p:Version=${{ steps.ver.outputs.version }} -o out/full

      # Small exe: needs the .NET 10 Desktop Runtime. (Bundle compression only works for self-contained.)
      - name: Publish single exe (framework-dependent)
        run: dotnet publish DiskTree.csproj -c Release -p:SelfContained=false -p:EnableCompressionInSingleFile=false -p:Version=${{ steps.ver.outputs.version }} -o out/slim

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item out/full/DiskTree.exe release/DiskTree.exe
          Copy-Item out/slim/DiskTree.exe release/DiskTree-slim.exe
          Get-ChildItem release | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Append -Encoding ascii release/SHA256SUMS.txt
          }
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: DiskTree
          path: release/*
          if-no-files-found: error

  # Only for tags (v1.0.0, ...): puts the exe files on the Releases page.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DiskTree
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --title "DiskTree ${{ github.ref_name }}" \
            --generate-notes \
            --notes "**DiskTree.exe** – eine einzelne Datei, läuft ohne Installation (Windows x64).
          **DiskTree-slim.exe** – sehr klein, braucht die .NET 10 Desktop-Laufzeit.
          Prüfsummen: SHA256SUMS.txt"
