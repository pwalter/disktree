name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Two merges in a row must not hand out the same release number.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # - tag v1.2.3            -> version 1.2.3 (release)
      # - push to main          -> version yyyy.M.d.N (date in Germany, N = running number of the day), release
      # - everything else       -> CI version, no release
      - name: Work out the version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = ''
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
            $v = $tag.TrimStart('v')
          }
          elseif ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}' -eq 'refs/heads/main') {
            $tz = [TimeZoneInfo]::FindSystemTimeZoneById('W. Europe Standard Time')
            $d = [TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $tz)
            $prefix = "{0}.{1}.{2}" -f $d.Year, $d.Month, $d.Day
            $existing = gh api "repos/${{ github.repository }}/git/matching-refs/tags/v$prefix." --jq '.[].ref' | Out-String
            $n = 1
            foreach ($r in ($existing -split "`n")) {
              if ($r.Trim() -match "refs/tags/v$([regex]::Escape($prefix))\.(\d+)$") { $n = [Math]::Max($n, [int]$Matches[1] + 1) }
            }
            $v = "$prefix.$n"
            $tag = "v$v"
          }
          else { $v = '0.0.0-ci.${{ github.run_number }}' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "Version: $v  Tag: $tag"

      - name: Build
        run: dotnet build DiskTree.csproj -c Release -p:Version=${{ steps.ver.outputs.version }}

      # A red test stops the job here, so nothing gets published or released.
      - name: Test
        run: dotnet test tests/DiskTree.Tests -c Release -p:Version=${{ steps.ver.outputs.version }} --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/DiskTree.Tests/TestResults/*.trx
          if-no-files-found: ignore

      # One self-contained exe: runs on any Windows x64 machine, nothing to install.
      - name: Publish single exe (self-contained)
        run: dotnet publish DiskTree.csproj -c Release -p:SelfContained=true -p:Version=${{ steps.ver.outputs.version }} -o out/full

      # Small exe: needs the .NET 10 Desktop Runtime. (Bundle compression only works for self-contained.)
      - name: Publish single exe (framework-dependent)
        run: dotnet publish DiskTree.csproj -c Release -p:SelfContained=false -p:EnableCompressionInSingleFile=false -p:Version=${{ steps.ver.outputs.version }} -o out/slim

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item out/full/DiskTree.exe release/DiskTree.exe
          Copy-Item out/slim/DiskTree.exe release/DiskTree-slim.exe
          Get-ChildItem release | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Append -Encoding ascii release/SHA256SUMS.txt
          }
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: DiskTree
          path: release/*
          if-no-files-found: error

  # Tags (v1.0.0, ...) and every push to main: puts the exe files on the Releases page.
  release:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # Sigstore signing for the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DiskTree
          path: release

      # Build provenance: anyone can check that an exe was built by this workflow from this repo:
      #   gh attestation verify DiskTree.exe --repo pwalter/disktree
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/DiskTree.exe
            release/DiskTree-slim.exe

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # For a pushed tag the tag already exists; for main it is created here on the built commit.
          gh release create "${{ needs.build.outputs.tag }}" release/*             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --title "DiskTree ${{ needs.build.outputs.version }}"             --generate-notes             --notes "**DiskTree.exe** – eine einzelne Datei, läuft ohne Installation (Windows x64).
          **DiskTree-slim.exe** – sehr klein, braucht die .NET 10 Desktop-Laufzeit.
          Prüfsummen: SHA256SUMS.txt
          Herkunft prüfen: gh attestation verify DiskTree.exe --repo ${{ github.repository }}"
